# =============================================================================
# Photo Gallery - Nginx Configuration
# =============================================================================
# Разместите этот файл: /etc/nginx/sites-available/photo-gallery
# Активируйте: sudo ln -s /etc/nginx/sites-available/photo-gallery /etc/nginx/sites-enabled/
# Перезапустите: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# =============================================================================
# Кэш изображений
# =============================================================================
# max_size = 1g, а не 10g из старой документации: на прод-VPS раздел 20G, и
# кэш на 10g гарантированно съедает свободное место (issue #27). 1g — с запасом
# относительно ~230K на миниатюру.
# inactive = 7d вместо 30d: залежавшиеся миниатюры дольше недели не нужны.
proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images_cache:10m max_size=1g inactive=7d use_temp_path=off;

#.Upstream для Next.js приложения
upstream photo_gallery {
    server 127.0.0.1:3000;
    keepalive 64;
}

# =============================================================================
# Токен cookie авторизации для ключа кэша миниатюр (issue #91)
# =============================================================================
# `$cookie_gallery_auth` здесь не работает: имя переменной в nginx не может
# содержать дефис, поэтому эта переменная ищет cookie `gallery_auth`, а
# приложение (src/lib/auth.ts, COOKIE_NAME) ставит `gallery-auth`. Первый
# вариант фикса #91 именно на этом и не сработал: ключ кэша оставался общим.
#
# `\x3b` вместо `;`: символ `;` в конфиге nginx завершает директиву даже
# внутри регулярного выражения, и `map` падает с "invalid number of the map
# parameters". `\x3b` — hex-escape PCRE, конфиг-парсер его не трогает.
#
# `default ""` обязателен: с пустым паролем cookie нет, ключ кэша остаётся
# общим, и кэш работает как раньше.
map $http_cookie $gallery_auth_token {
    default "";
    "~*gallery-auth=(?<token>[^\x3b]+)" $token;
}

# HTTP -> HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;
    
    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

# Основной HTTPS сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ==========================================================================
    # SSL Конфигурация (Let's Encrypt)
    # ==========================================================================
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    
    # Современные настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # HSTS (опционально, для большей безопасности)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ==========================================================================
    # Логи
    # ==========================================================================
    access_log /var/log/nginx/photo-gallery.access.log;
    error_log /var/log/nginx/photo-gallery.error.log;

    # ==========================================================================
    # Gzip сжатие
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    # ==========================================================================
    # Корневая директория (для статических файлов)
    # ==========================================================================
    root /var/www/apps/photo-gallery/release/public;
    
    # ==========================================================================
    # Статические файлы Next.js с кэшированием
    # ==========================================================================
    
    # Next.js статика (_next/static/)
    # ^~ обязателен: без него regex-локация ниже (для jpg/png/woff2/...)
    # перехватывает шрифты Next (они тоже .woff2) и отдаёт их через root
    # public/ вместо alias на .next/static/, что даёт 404 на все шрифты.
    location ^~ /_next/static/ {
        alias /var/www/apps/photo-gallery/release/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    
    # Изображения из public папки
    location /demo-photos/ {
        alias /var/www/apps/photo-gallery/release/public/demo-photos/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        
        # Поддержка WebP
        add_header Vary Accept;
    }
    
    # Общие статические файлы (шрифты сюда не входят — их обслуживает
    # блок /_next/static/ выше, см. комментарий там)
    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }
    
    # ==========================================================================
    # Изображения и миниатюры (/api/images)
    # ==========================================================================
    # Отдельная локация нужна по двум причинам:
    #  1) access_log off — иначе каждый запрос миниатюры попадает в лог, и на
    #     проде это был главный потребитель диска (issue #9);
    #  2) дисковый кэш nginx — иначе каждую миниатюру заново генерирует
    #     Node + sharp на единственном ядре VPS (issue #3).
    #
    # ВНИМАНИЕ: префикс /api/images длиннее /api/ и перебивает его. Поэтому
    # все proxy_set_header из location /api/ обязаны быть продублированы здесь:
    # без X-Forwarded-For src/proxy.ts видит ip = 'unknown' для всех клиентов
    # сразу, и rate-limit достаётся общему бакету.
    location /api/images {
        proxy_pass http://photo_gallery;
        proxy_http_version 1.1;
        
        # Заголовки — полный набор, идентичный location /api/ ниже
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Логи
        access_log off;
        
        # Кэш на диске
        proxy_cache images_cache;
        proxy_cache_valid 200 7d;
        # Cookie в ключе обязателен: без него первый авторизованный 200 лёг бы
        # в кэш под общим ключом и отдавался анонимному клиенту до 7 суток (#91).
        # Значение берётся из map выше: `$cookie_gallery_auth` не видит cookie
        # с дефисом в имени.
        # Префикс v3: гарантирует, что записи, положенные ключом v2 (там cookie
        # фактически не участвовала), больше ни с чем не совпадут — иначе
        # анонимный запрос попал бы ровно в тот же ключ, что и до правки.
        # Без пароля cookie пустая, ключ общий — кэш работает как раньше.
        proxy_cache_key "v3:$scheme$request_method$host$request_uri$gallery_auth_token";
        proxy_cache_use_stale error timeout updating;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        
        # Таймауты — как у /api/
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        
        # Буферизация здесь ОСТАЁТСЯ включённой (в location /api/ она
        # выключена ради стриминга видео). Для кэширования ответ должен
        # буферизоваться.
        
        # add_header внутри location ПОЛНОСТЬЮ заменяет унаследованные от
        # server {}, поэтому HSTS приходится дублировать — иначе он бы
        # пропал для всех запросов /api/images. X-Cache-Status нужен, чтобы
        # проверять кэш снаружи: curl -I и смотреть HIT/MISS/BYPASS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ==========================================================================
    # API маршруты
    # ==========================================================================
    # Внимание: /api/images выше перебивает этот блок для изображений.
    # Остальные маршруты идут сюда. proxy_buffering off — ради видео.
    location /api/ {
        proxy_pass http://photo_gallery;
        proxy_http_version 1.1;
        
        # Заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Таймауты для больших файлов
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
        
        # Буферизация
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ==========================================================================
    # Основной proxy для Next.js
    # ==========================================================================
    location / {
        proxy_pass http://photo_gallery;
        proxy_http_version 1.1;
        
        # WebSocket поддержка (для Hot Reload в development)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # Стандартные заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Буферы
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ==========================================================================
    # Безопасность
    # ==========================================================================
    
    # Скрыть версию Nginx
    server_tokens off;
    
    # Защита от больших запросов
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    
    # Запретить доступ к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Запретить доступ к файлам окружения
    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }
}

