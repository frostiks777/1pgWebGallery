name: Health check

# #166: probes the app and its WebDAV backend, not just an open TCP port.
# A wedged box writes no 5xx at all (incident 2026-10-15), so nginx logs prove
# nothing. GitHub cron can lag by minutes: this complements the external uptime
# monitor (A1.10), it does not replace it.
#
# TELEGRAM_BOT_TOKEN and TELEGRAM_ALLOWED_CHAT_ID are repository secrets; while
# they are missing the job fails with a clear ::error:: instead of staying green.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /api/health
        env:
          APP_URL: ${{ vars.APP_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Repository variable APP_URL is not set"
            exit 1
          fi
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_ALLOWED_CHAT_ID secrets are not set"
            exit 1
          fi

          url="${APP_URL%/}/api/health"
          body="$(mktemp)"
          # curl prints 000 on DNS/connection failure; the earlier
          # `|| echo 000` appended a second one ("HTTP 000000" on the first
          # prod test), so `|| true` keeps curl's own 000.
          code="$(curl -sS --max-time 10 -o "$body" -w '%{http_code}' "$url" || true)"
          code="${code:-000}"

          if [ "$code" = "200" ]; then
            echo "Health OK: $(cat "$body")"
            exit 0
          fi

          echo "::error::Health check failed with HTTP $code"

          # No body in the message: it is public, but a future change could add
          # internal details there, and Telegram is not the place to discover it.
          curl -sS --max-time 10 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Photo Gallery: /api/health вернул HTTP ${code} в $(date -u '+%Y-%m-%d %H:%M UTC')" \
            > /dev/null
          exit 1
