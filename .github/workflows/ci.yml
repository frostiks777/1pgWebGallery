name: CI

# ADR-0003: lint + build, оба блокирующие.
#
# Гейт на `main` живёт в deploy.yml: он собирает тот же коммит и падает на
# lint/build до rsync на сервер (#154). Поэтому здесь только pull_request —
# иначе каждый пуш в main собирался бы дважды (#8).
#
# E2e здесь намеренно нет — он остаётся локальным гейтом
# (`bun run test:e2e`, .agents/shared/checks.md): он требует Chromium
# и поднимает `next dev`. Возврат e2e в CI — открытый вопрос, см. issue #13.

on:
  pull_request:
    branches: [main]

# Новые коммиты в тот же PR отменяют предыдущий прогон; main здесь не бывает.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Кеш Turbopack переживает прогоны. Ключ только по bun.lock: инвалидацию
      # исходников Next делает сам, а restore-keys даёт fallback, когда lockfile
      # изменился. deploy.yml пишет этот же кеш на push в main, PR его читает.
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-

      - name: Lint
        run: bun run lint

      - name: Build (standalone output)
        run: bun run build
