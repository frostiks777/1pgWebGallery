name: CI

# ADR-0003: lint + build, оба блокирующие. Baseline-ошибки
# react-hooks/set-state-in-effect закрыты (9 штук), `continue-on-error`
# у шага Lint снят 2026-10-15.
#
# E2e здесь намеренно нет — он остаётся локальным гейтом
# (`npm run test:e2e`, .agents/shared/checks.md): он требует Chromium
# и поднимает `next dev`. Возврат e2e в CI — открытый вопрос, см. issue #13.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Новые коммиты в тот же PR глушим, деплой по ветке main не отменяем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build (standalone output)
        run: bun run build
