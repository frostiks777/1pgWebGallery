# Регулярная проверка качества приложения агентом OpenCode.
#
# События:
#   * `schedule`       — раз в сутки, 06:17 UTC (cron — не чаще одного запуска в сутки,
#                       время не круглое, чтобы не совпадать с пиком GitHub Actions);
#   * `workflow_dispatch` — ручной запуск из вкладки Actions.
#
# Два независимых источника данных, один разбор агентом:
#   * `code-audit`   — реальные проверки репозитория (`eslint`, `tsc`); их вывод —
#                      единственный в этом проекте машинный сигнал о состоянии кода;
#   * `lighthouse`   — замер прода по адресу из Variables репозитория (`APP_URL`).
#                      Адрес не вписан в воркфлоу: переезд стенда не должен требовать
#                      правки воркфлоу и попадать в историю коммитов. Если переменная
#                      не задана, job пропускается целиком, а агент работает по отчёту
#                      о проверках кода.
#
# Права: агент читает код и заводит issue по находкам отчёта — это единственная
# запись воркфлоу, поэтому `issues: write` достаточно. `contents: write` и
# `pull-requests: write` НЕ запрашиваем: пуш в `main` = деплой на прод, а лишние
# права увеличивают площадь, с которой агент может дотянуться до репозитория.
#
# Токен агента — токен раннера (`use_github_token: true`), а не токен GitHub App
# `opencode-agent` по OIDC. У App'а `contents: write` и `pull-requests: write`,
# и PR открывал вовсе не агент, а инфраструктура экшена: она коммитит и пушит
# дерево, если после прогона оно осталось грязным, а затем открывает PR. Отчёт
# аудита лежал в отслеживаемых файлах, поэтому дерево было грязным на каждом
# прогоне, и очередь PR росла сама, даже когда находок не было (#80). На токене
# раннера прав на запись в репозиторий не остаётся вовсе (`contents: read`): ни
# пуш ветки, ни PR невозможны, провал виден ошибкой шага. Issue при этом
# создаются как раньше — `gh` ходит с `GITHUB_TOKEN` из env, и автором остаётся
# `github-actions[bot]`.
#
# Модель задаётся переменной репозитория `OPENCODE_MODEL` — не обязательно та,
# что в `opencode.jsonc`: отключение модели провайдером не должно требовать
# правки этого файла.

name: opencode-audit

on:
  schedule:
    # 06:17 UTC = 09:17 Europe/Moscow. Раз в сутки.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # `id-token: write` больше не нужен: экшен работает на токене раннера
  # (`use_github_token: true`), обмена OIDC-токена на токен приложения
  # opencode-agent не происходит — а вместе с ним и прав на запись в репозиторий.
  # Почему так — в шапке файла и в #80.

concurrency:
  # Один аудит одновременно: ручной запуск не должен дублировать плановый.
  group: opencode-audit
  cancel-in-progress: false

jobs:
  code-audit:
    name: Проверки репозитория (lint + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Проверки падают кодом возврата, если в проекте снова появится ошибка
      # (сейчас baseline пустой, `bun run lint` и `bunx tsc --noEmit` чистые).
      # Код возврата игнорируем намеренно: в этом воркфлоу проверка не блокирует
      # прогон, а её вывод попадает в отчёт и дальше в разбор агента. Блокирующая
      # проверка живёт отдельно в `ci.yml`.
      - name: Собрать отчёт о проверках
        run: |
          mkdir -p audit-report/code
          {
            echo "# Проверки репозитория"
            echo
            echo "Дата: $(date -u +%Y-%m-%dT%H:%M:%SZ), коммит: ${GITHUB_SHA}"
            echo
            echo "## eslint (bun run lint)"
            echo
          } > audit-report/code/code-audit.md
          set +e
          bun run lint >> audit-report/code/code-audit.md 2>&1
          echo "eslint exit code: $?" >> audit-report/code/code-audit.md
          {
            echo
            echo "## tsc (bunx tsc --noEmit)"
            echo
          } >> audit-report/code/code-audit.md
          bunx tsc --noEmit >> audit-report/code/code-audit.md 2>&1
          echo "tsc exit code: $?" >> audit-report/code/code-audit.md
          set -e
          cat audit-report/code/code-audit.md

      - name: Сохранить отчёт артефактом
        uses: actions/upload-artifact@v4
        with:
          name: code-audit-report
          path: audit-report/code/
          retention-days: 30

  lighthouse:
    name: Lighthouse по стенду
    # Без `APP_URL` в Variables замер невозможен — молча пропускаем job, а агент
    # разбирает только отчёт о проверках кода.
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Нужен ради `scripts/lighthouse-summary.mjs`; коммитить тут нечего.
          persist-credentials: false

      - name: Set up Bun
        # bun не предустановлен на ubuntu-latest, а запускать lighthouse надо через
        # `bunx`: `devEngines.packageManager` требует bun, и `npx` в корне чекаута
        # падает с EBADDEVENGINES. См. #36.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Проверить адрес стенда
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Не задана переменная репозитория APP_URL (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          echo "APP_URL=$APP_URL"

      - name: Установить Chrome
        # На ubuntu-latest Chrome может отсутствовать или быть не тем каналом;
        # lighthouse запускает именно системный Chrome, поэтому ставим явно.
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Собрать отчёт Lighthouse
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          mkdir -p audit-report/lighthouse
          # bunx, not npx: `devEngines.packageManager` requires bun, so npm's runner
          # aborts with EBADDEVENGINES inside a checkout. See issue #36.
          bunx --yes lighthouse@12 --version
          set +e
          # `--output-path` — это префикс имени файла, а не папка: без суффикса
          # Lighthouse пишет `audit-report.report.json` в корень репозитория.
          # Поэтому задаём `audit-report/lighthouse/report`, а дальше ищем файл по glob.
          bunx --yes lighthouse@12 "$APP_URL" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output=html \
            --output-path=./audit-report/lighthouse/report \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage"
          code=$?
          set -e
          echo "lighthouse exit code: $code"
          ls -la audit-report/lighthouse || true
          report_json=$(ls audit-report/lighthouse/*.json 2>/dev/null | head -n 1)
          if [ -z "$report_json" ]; then
            echo "::error::Lighthouse не создал JSON-отчёт (exit code $code)"
            exit 1
          fi
          if [ "$code" != "0" ]; then
            echo "::warning::Lighthouse завершился с кодом $code, но отчёт есть — используем его"
          fi
          echo "Отчёт: $report_json"

      - name: Свести отчёт в Markdown
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: node scripts/lighthouse-summary.mjs audit-report/lighthouse

      - name: Сохранить отчёт артефактом
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: audit-report/lighthouse/
          retention-days: 30

  audit:
    name: Разбор отчётов агентом
    # Отчёты собраны — агент разбирает находки и заводит issue.
    # `always()` — прогон разбора не должен отменяться, если Lighthouse не смог
    # замерить стенд: отчёт о проверках кода ценен сам по себе.
    needs: [code-audit, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Достаточно прочитать код и завести issue: коммитить тут нечего, а
          # прав на запись в репозиторий у воркфлоу нет.
          persist-credentials: false

      # Пустая модель даст `openrouter/`, и opencode молча уедет на модель по
      # умолчанию. Такая же проверка стоит у `APP_URL` выше.
      - name: Проверить переменную модели
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: |
          if [ -z "$OPENCODE_MODEL" ]; then
            echo "::error::Не задана переменная OPENCODE_MODEL (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          echo "Модель агента: openrouter/$OPENCODE_MODEL"

      - name: Скачать отчёт о проверках
        uses: actions/download-artifact@v4
        with:
          name: code-audit-report
          path: audit-report/code

      - name: Скачать отчёт Lighthouse
        # Job мог быть пропущен (не задана `APP_URL`) или упасть — это не повод
        # ронять разбор.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-report
          path: audit-report/lighthouse

      # Отчёты лежат в `audit-report/`, а он не отслеживается git'ом и в
      # `.gitignore` — поэтому скачивание артефактов не делает дерево грязным.
      # Пока файлы отчётов были отслеживаемыми, дерево оказывалось грязным на
      # каждом прогоне, и инфраструктура экшена коммитила перезаписанный отчёт
      # и открывала PR — даже при нуле находок (#80). Эта проверка ловит
      # возвращение такого состояния до агента, а не постфактум.
      - name: Проверить, что рабочее дерево чистое
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "::error::Рабочее дерево грязное до запуска агента — отчёт или иной файл снова отслеживается git'ом:"
            echo "$status"
            exit 1
          fi

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Пушить агент не может (прав на запись нет), но если попытается —
          # пусть упадёт сразу, а не ждёт ввода логина: интерактивного терминала
          # в раннере нет.
          GIT_TERMINAL_PROMPT: '0'
          # OpenRouter, а не Google AI Studio: там бесплатный тир даёт
          # flash-моделям 20 запросов в СУТКИ, и агентская сессия выбирает это
          # за один прогон, после чего Google отвечает «retry in 11h». Платный
          # ключ OpenRouter снимает и RPM, и суточный потолок, а прогон стоит
          # единицы центов. Почему так — ADR 0004, «Обновление 2026-10-27
          # (третье)».
          #
          # Имя переменной не произвольное: провайдер openrouter читает ключ
          # только из OPENROUTER_API_KEY. Секрет GEMINI_API_KEY больше никем не
          # читается — его можно удалить.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Служебную модель (заголовок сессии) приравниваем к основной —
          # иначе каждый прогон начинается с `Model access is disabled` от
          # отключённого дешёвого варианта провайдера. На результат не влияет,
          # но в логе выглядит как поломка. Почему так — в ADR 0004, «Обновление
          # 2026-10-15 (второе)». `OPENCODE_CONFIG_CONTENT` — inline-конфиг с
          # наивысшим приоритетом, репозиторный `opencode.jsonc` не затрагивается.
          OPENCODE_CONFIG_CONTENT: '{"small_model":"openrouter/${{ vars.OPENCODE_MODEL }}"}'
        with:
          # Модель одна на все воркфлоу: платный ключ OpenRouter не ограничен
          # ни RPM, ни суточной квотой, поэтому делить модели по длине сессии
          # больше не нужно (сплит существовал ради квот бесплатного тира Google).
          model: openrouter/${{ vars.OPENCODE_MODEL }}
          # Токен раннера вместо токена приложения opencode-agent: у агента не
          # остаётся ни прав на запись в репозиторий, ни возможности открыть PR.
          # Почему так — в шапке файла и в #80.
          use_github_token: true
          # Решение по `share`: разбор отчётов не публикуется, хотя дефолт
          # opencode для публичного репозитория — `share: true`.
          share: false
          prompt: |
            Это регулярная проверка качества фото-галереи. Репозиторий уже выкачан,
            отчёты лежат в файлах — прочитай их первым делом:

            - `audit-report/code/code-audit.md` — вывод `eslint` и `tsc`;
            - `audit-report/lighthouse/summary.md` — сводка Lighthouse по стенду
              (может отсутствовать: замер не проходит, если не задан `APP_URL` или
              приложение отдаёт экран пароля — в этом случае про Lighthouse забудь).

            Заведи **не больше двух** issue: только по находкам, которые действительно
            стоит исправлять, и разнеси их по темам (находки кода отдельно от
            находок производительности и доступности).

            Что делать:

            1. Отдели находки, которые относятся к коду этого репозитория (настройки
               сборки, шрифты, картинки, мета-теги, размер бандла, доступность
               разметки), от находок на стороне хостинга или CDN — вторые в отдельный
               раздел «вне нашего контроля».
            2. **Считай каждую ошибку eslint/tsc новой.** Baseline в проекте пустой:
               `bun run lint` и `bunx tsc --noEmit` проходят чисто, любая ошибка в
               отчёте — регрессия, а не известная проблема. Две исключенные из CI
               зоны, которые всё равно не считать находкой: `bun run build` требует
               исходящего HTTPS к Google Fonts (это ограничение среды, не дефект
               кода), а e2e в аудите не запускаем: ему нужны Chromium и поднятый
               `next dev`, а в CI это дорого и нестабильно. Локально e2e работает
               (`.agents/shared/checks.md`).
               По Lighthouse ориентируйся на пороги из отчёта —
               производительность ниже 70, доступность ниже 90, лучшие практики или
               SEO ниже 80.
            3. **Не** заводи issue ради микрооптимизаций и ради того, что не
               воспроизводится из отчёта. Если находка ниже порога — не заводи,
               просто напиши это в теле.
            4. В issue напиши: что замеряем (число и порог), где это в коде
               (`путь/файл:строка`), почему это важно гостю, и что считается
               исправлением.
            5. Перед заведением issue проверь через `gh issue list` и `gh issue list
               --state all --search "<тема>"`, не заводил ли уже кто-то такое —
               дубли не создавай, а допиши в существующий.
            6. Метки на новом issue проставь по `docs/agents/triage-labels.md`
               (`needs-triage`, `ready-for-human` — правку делает человек).

            Не правь код: это регулярная проверка, а не реализация.
            **Ничего не коммить, не пушь, не создавай ветки и не открывай PR** —
            записи в код репозитория нет, и попытка упрётся в ошибку.
            При этом **заводи issue — можно и нужно**: это и есть работа аудита,
            право `issues: write` у прогона есть. Отчёт публикуется артефактом
            (`code-audit-report`, `lighthouse-report`) и в сводке прогона.

      # Диагностика для случая, когда агент всё же что-то изменил: инфраструктура
      # экшена попыталась это закоммитить и запушить и упала — прав на запись в
      # репозиторий нет. Показываем, что именно изменилось, чтобы прогон не
      # выглядел загадочной ошибкой авторизации.
      - name: Показать, что изменил агент
        if: always()
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "::warning::Агент изменил файлы в рабочем дереве — PR не открыт, прав на запись в репозиторий нет:"
            echo "$status"
          fi

      - name: Опубликовать сводку в логе прогона
        # `always()`: сводка ценна и когда разбор упал — в ней сам отчёт.
        if: always()
        run: |
          {
            echo "## Регулярная проверка качества"
            echo
            echo "### Проверки репозитория"
            echo
            if [ -f audit-report/code/code-audit.md ]; then
              cat audit-report/code/code-audit.md
            else
              echo "Отчёт о проверках репозитория недоступен."
            fi
            if [ -f audit-report/lighthouse/summary.md ]; then
              echo
              echo "### Lighthouse"
              echo
              cat audit-report/lighthouse/summary.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"