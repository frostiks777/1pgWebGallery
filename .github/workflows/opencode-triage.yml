# Автотриаж новых задач: агент OpenCode разбирает issue сразу при создании.
#
# Событие `issues` не берёт инструкцию из комментария (его ещё нет),
# поэтому `prompt` здесь обязателен — без него воркфлоу не запустится.
#
# GitHub App `opencode-agent` установлен на репозиторий: агент работает на токене
# приложения, который экшен получает обменом OIDC-токена (нужен `id-token: write`).
# На токене раннера он видел `permission: none` и падал на удалении реакции.
# Модель бесплатная, задаётся переменной репозитория `OPENCODE_MODEL` — не
# обязательно та, что в `opencode.jsonc`: отключение модели провайдером не должно
# требовать правки этого файла.
#
# Роль воркфлоу в проекте: автотриаж — черновик постановки задачи (см. ADR-0002,
# гибридный трекинг `ai/tasks` + GitHub Issues). Разбор агента не заменяет решение
# Андрея, но экономит время на первичном разборе.

name: opencode-triage

on:
  issues:
    types: [opened]

permissions:
  # Чтение репозитория: агент разбирает код и пишет разбор в комментарий
  # задачи. Ничего не коммитит, поэтому права на запись в репозиторий не нужны.
  contents: read
  # Комментарий с разбором пишется в issue — это единственная запись воркфлоу.
  issues: write
  # Обязателен: без `use_github_token` экшен обменивает OIDC-токен на токен
  # приложения opencode-agent, и права у агента настоящие, а не «none».
  id-token: write

jobs:
  triage:
    # Только задачи, заведённые человеком: issue, открытое ботом (например,
    # release-please), не должно будить агента и тратить минуты Actions.
    if: github.event.sender.type != 'Bot' && github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    # Зависший прогон агента не должен держать раннер до дефолтных 360 минут.
    timeout-minutes: 15
    concurrency:
      group: opencode-triage-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Пустая `OPENCODE_MODEL` даст `opencode/`, и opencode молча уедет на
      # модель по умолчанию. Проверка такая же, как для `APP_URL`
      # в `opencode-audit.yml`.
      - name: Проверить переменную модели
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: |
          if [ -z "$OPENCODE_MODEL" ]; then
            echo "::error::Не задана переменная репозитория OPENCODE_MODEL (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          echo "Модель агента: opencode/$OPENCODE_MODEL"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          # Модель — переменная репозитория `OPENCODE_MODEL`, а не строка
          # здесь: переключение не должно требовать правки четырёх воркфлоу.
          model: opencode/${{ vars.OPENCODE_MODEL }}
          # Решение по `share`: сессия агента не публикуется, хотя для публичного
          # репозитория дефолт opencode — `share: true`. В сессии видны вывод
          # команд и фрагменты кода.
          share: false
          prompt: |
            Разбери эту задачу как инженер, который берёт её в работу. Репозиторий уже
            выкачан — читай код, ничего не меняй.

            Прочитай `AGENTS.md` — там устройство проекта, команды и правила агента,
            которые важнее общих соображений. Затем `.agents/skills/interview/SKILL.md`
            и `.agents/skills/plan/SKILL.md`: раздели найденные факты от предположений,
            ссылайся на конкретные файлы и строки. Термины бери из `CONTEXT.md`.

            Ответь комментарием в этом issue:
            1. **Причина** — что именно ломается или чего не хватает, без общих слов.
            2. **Затронутые части кода** — путь данных от интерфейса до бизнес-правила,
               который принимает решение, со ссылками `путь/файл:строка`. Учти, что
               страница галереи целиком живёт в `src/app/page.tsx`, раскладки — в
               `src/components/gallery/`, API — в `src/app/api/*/route.ts`.
            3. **Предлагаемый путь** — что менять и в каком порядке, без готового кода.
            4. **Что считается исправлением** — проверяемая формулировка, по которой
               задачу можно взять в работу и принять.
            5. **Вопросы** — только те, ответ на который меняет реализацию. Если вопросов
               нет, так и напиши.

            Особенности этого репозитория, которые легко упустить:
            - `.data/` — состояние пользователя (скрытые фото, обложки, панорамы), а не
              кеш; его формат менять без ADR нельзя;
            - все пользовательские строки — на русском, e2e-спеки выбирают элементы
              по ним;
            - `npx eslint .` и `npx tsc --noEmit` сейчас чистые — любая ошибка
              линтера или типов в твоём разборе это находка, а не известный baseline.

            Если поведение уже реализовано или жалоба неточна — скажи прямо и объясни,
            что на самом деле происходит. Не выдумывай проблему, которой нет в коде.