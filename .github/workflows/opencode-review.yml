# Авторевью pull request агентом OpenCode.
#
# Событие `pull_request` с типами opened/synchronize/reopened/ready_for_review —
# агент разбирает каждый PR сам, по критериям из `prompt`.
#
# Права: комментарий в pull request и реакция создаются токеном приложения
# opencode-agent, а не токеном раннера. На токене раннера (`use_github_token: true`)
# экшен видел `permission: none` для `github-actions[bot]` и падал на удалении
# реакции. Права на запись всё равно нужны: агент оставляет замечания, одобрять
# и мержить не может — таких прав нет.
#
# `id-token: write` обязателен: по нему экшен обменивает OIDC-токен на токен
# приложения.

name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  # Только чтение репозитория: агент читает diff, код и связанную задачу.
  contents: read
  # Единственная запись воркфлоу — замечания в pull request.
  pull-requests: write
  # `issues: write` здесь не нужен: воркфлоу не пишет в задачи, только в PR.
  id-token: write

jobs:
  review:
    # Только pull request, заведённые человеком. PR от ботов (release-please,
    # Dependabot) не должны будить агента и тратить минуты Actions: на таком PR
    # он всё равно не может выполнить запись и падает.
    # Проверка `head.repo.full_name` отсекает PR из форков: на них секреты
    # недоступны (`OPENCODE_API_KEY` пустой), а `GITHUB_TOKEN` у форка
    # read-only, поэтому агент всё равно не смог бы оставить замечания — был бы
    # только красный крест и сожжённые минуты.
    if: >
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Зависший прогон агента не должен держать раннер до дефолтных 360 минут.
    timeout-minutes: 15
    # Каждый push в PR отменяет предыдущий прогон ревью: старый не висит
    # в pending и не блокирует чек устаревшим статусом.
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Достаточно прочитать diff, коммитить нечего: права только на чтение.
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/mimo-v2.6-flash-free
          # Решение по `share`: ревью не публикуется, хотя дефолт opencode для
          # публичного репозитория — `share: true`.
          share: false
          prompt: |
            Проведи ревью этого pull request и оставь замечания комментариями.
            Не меняй код, не коммить, не мержи — только замечания. Если замечаний
            нет, так и напиши и не выдумывай мелочи.

            Прочитай `AGENTS.md` и `.agents/shared/checks.md` — это правила проекта,
            они важнее общих соображений о качестве кода.

            Что проверять в первую очередь:

            1. **Соответствие задаче.** Прочитай связанный issue (`Closes #N` в
               описании или в коммитах) и описание PR. Совпадает ли фактический
               diff с тем, о чём просил issue? Нет ли лишнего или недостающего.

            2. **Корректность.** Логика, граничные случаи, ошибки в расчётах,
               необработанные ответы API, неверные типы. Отдельно проверь
               асинхронность: не остаются ли гонки и не теряются ли ошибки.
               Для этого репозитория важно ещё два места:
               - `.data/` — состояние пользователя, а не кеш; его нельзя затирать,
                 переносить в кеш или менять формат без ADR;
               - `src/proxy.ts` — rate-limit и опциональный `API_SECRET_TOKEN`;
                 `/api/images` exempt из лимита, это не должно сломаться.

            3. **Тесты.** Есть ли спека в `tests/e2e/`, которая падала бы до правки и
               проходит после. Unit-тестов в проекте нет — не требуй их и не пиши
               «добавь Vitest». Соответствует ли спека заявленному эффекту. Не
               проверяет ли спека деталь рендера вместо смысла.

            4. **Конвенции репозитория** (читай `AGENTS.md`):
               - пользовательские строки — на русском, спеки выбирают элементы по ним;
               - классы карточек и CSS-переменные с префиксом `obs-`;
               - скрипты `package.json` зовут `bunx`: в CI и в проверках запускай
                 инструменты напрямую через `npx`;
               - комментарии в коде объясняют «почему», а не «что»;
               - сообщения коммитов по Conventional Commits, для фич и багов — со
                 ссылкой на issue (`(#NN)`).

            5. **Границы.** Не задевается ли что-то за пределы задачи: формат
               `.data/`, контракт API, публичное поведение галереи. Для таких
               решений нужен ADR (`docs/adr/`), а не правка в том же PR.

            Формат замечания: что не так, почему это важно, как исправить.
            Коротко. Если замечание по вкусу, а не по существу, не пиши его.