# =============================================================================
# Photo Gallery — ротация логов nginx
# =============================================================================
# Разместите этот файл: /etc/logrotate.d/photo-gallery
# Проверьте:      sudo logrotate -d /etc/logrotate.d/photo-gallery
# Форсировать:    sudo logrotate -f /etc/logrotate.d/photo-gallery
#
# ВАЖНО: пакет logrotate должен быть установлен. На прод-VPS конфиг лежал в
# /etc/logrotate.d/nginx, но самого пакета не было — `logrotate: command not
# found`, поэтому файлы росли неограниченно (issue #9). Если сомневаетесь:
# apt install logrotate
#
# Ротация покрывает только логи этого сайта: /var/log/nginx/access.log на
# этой же машине пишет чужой (дефолтный) vhost, и его сюда добавлять не надо.
# =============================================================================

/var/log/nginx/photo-gallery.access.log
/var/log/nginx/photo-gallery.error.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts

    # nginx продолжает писать в уже открытый файловый дескриптор, поэтому после
    # переименования нужен reopen. USR1 — именно reopen; reload здесь лишний,
    # он перечитывает конфиг и рвёт активные соединения.
    postrotate
        if [ -f /run/nginx.pid ]; then
            kill -USR1 "$(cat /run/nginx.pid)"
        fi
    endscript
}